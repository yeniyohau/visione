  <style amp-custom>
    :root{
      --rv-bg:#070002;
      --rv-panel:#190006;
      --rv-wine:#520012;
      --rv-ruby:#ae002a;
      --rv-red:#ed1745;
      --rv-hot:#ff5275;
      --rv-pink:#ff9caf;
      --rv-blue:#167fe6;
      --rv-text:#fff3f6;
      --rv-muted:#e5aeb9;
      --rv-line:rgba(255,91,122,.38)
    }

    *{box-sizing:border-box}

    html{background:var(--rv-bg)}

    body{
      position:relative;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      width:100%;
      min-height:100vh;
      min-height:100svh;
      margin:0;
      padding:18px 9px calc(18px + env(safe-area-inset-bottom));
      overflow-x:hidden;
      color:var(--rv-text);
      background:
        radial-gradient(circle at 50% -10%,#145a3e 0%,#005838 29%,#002416 58%,#002617 100%);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(135deg,transparent 0 19px,rgba(255,255,255,.015) 19px 21px),
        radial-gradient(circle at 10% 25%,rgba(255,31,76,.1),transparent 27%),
        radial-gradient(circle at 90% 75%,rgba(87,0,22,.2),transparent 30%)
    }

    .rv-amp-stage{
      position:relative;
      z-index:1;
      width:100%;
      max-width:470px;
      margin:auto
    }

    .rv-vault-shell{
      position:relative;
      isolation:isolate;
      overflow:hidden;
      background:
        linear-gradient(155deg,rgba(72,0,16,.97),rgba(17,0,5,.99) 48%,rgba(47,0,11,.98));
      border:1px solid var(--rv-line);
      border-radius:26px;
      box-shadow:
        0 24px 60px rgba(0,0,0,.72),
        0 0 38px rgba(212,0,49,.2),
        inset 0 1px 0 rgba(255,255,255,.13),
        inset 0 -15px 30px rgba(0,0,0,.32)
    }

    .rv-vault-shell::before{
      content:"";
      position:absolute;
      top:0;
      left:8%;
      right:8%;
      z-index:4;
      height:2px;
      background:
        linear-gradient(90deg,transparent,var(--rv-hot),#ffe0e6,var(--rv-hot),transparent);
      filter:drop-shadow(0 0 7px var(--rv-red));
      animation:rvTopPulse 3s ease-in-out infinite
    }

    .rv-vault-shell::after{
      content:"";
      position:absolute;
      top:-60%;
      left:-55%;
      z-index:3;
      width:32%;
      height:220%;
      pointer-events:none;
      background:
        linear-gradient(90deg,transparent,rgba(255,255,255,.04),rgba(255,255,255,.2),rgba(255,255,255,.04),transparent);
      transform:rotate(22deg);
      animation:rvVaultSweep 7s ease-in-out infinite
    }

    .rv-vault-top{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:13px 15px;
      background:
        linear-gradient(180deg,rgba(101,0,24,.88),rgba(34,0,8,.94));
      border-bottom:1px solid rgba(255,84,116,.28);
      box-shadow:inset 0 -8px 16px rgba(0,0,0,.24);
      font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:9px;
      font-weight:800;
      letter-spacing:.35px;
      text-transform:uppercase
    }

    .rv-vault-mark{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--rv-pink)
    }

    .rv-vault-gem{
      width:11px;
      height:11px;
      background:linear-gradient(145deg,#ff7891,var(--rv-ruby));
      border:1px solid rgba(255,213,221,.7);
      transform:rotate(45deg);
      box-shadow:0 0 12px rgba(255,51,91,.65);
      animation:rvGemPulse 2.2s ease-in-out infinite
    }

    .rv-vault-status{
      display:flex;
      align-items:center;
      gap:6px;
      color:#fff
    }

    .rv-vault-status::before{
      content:"";
      width:7px;
      height:7px;
      background:#58ff9c;
      border-radius:50%;
      box-shadow:0 0 9px rgba(88,255,156,.9);
      animation:rvStatusBlink 1.5s ease-in-out infinite
    }

    .rv-vault-body{
      position:relative;
      padding:18px
    }

    .rv-brand-lockup{
      width:100%;
      max-width:215px;
      margin:0 auto 10px
    }

    .rv-brand-lockup amp-img{
      filter:drop-shadow(0 0 14px rgba(255,46,88,.38))
    }

    .rv-kicker{
      position:relative;
      margin:12px 0 17px;
      color:var(--rv-pink);
      font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:10px;
      font-weight:800;
      line-height:1.6;
      letter-spacing:.35px;
      text-align:center;
      text-transform:uppercase;
      text-shadow:0 0 10px rgba(255,49,91,.32)
    }

    .rv-kicker::before,
    .rv-kicker::after{
      content:"◆";
      display:inline-block;
      margin:0 8px;
      color:var(--rv-hot);
      font-size:8px;
      transform:rotate(45deg)
    }

    .rv-hero-card{
      position:relative;
      padding:5px;
      overflow:hidden;
      background:
        linear-gradient(145deg,rgba(255,87,119,.34),rgba(86,0,20,.35));
      border:1px solid rgba(255,111,139,.56);
      border-radius:18px;
      box-shadow:
        0 14px 30px rgba(0,0,0,.48),
        0 0 24px rgba(202,0,47,.22),
        inset 0 1px 0 rgba(255,255,255,.16)
    }

    .rv-hero-card::before,
    .rv-hero-card::after{
      content:"";
      position:absolute;
      z-index:2;
      width:33px;
      height:33px;
      pointer-events:none
    }

    .rv-hero-card::before{
      top:9px;
      left:9px;
      border-top:2px solid var(--rv-hot);
      border-left:2px solid var(--rv-hot);
      border-radius:7px 0 0
    }

    .rv-hero-card::after{
      right:9px;
      bottom:9px;
      border-right:2px solid var(--rv-hot);
      border-bottom:2px solid var(--rv-hot);
      border-radius:0 0 7px
    }

    .rv-hero-media{
      position:relative;
      overflow:hidden;
      border-radius:13px
    }

    .rv-hero-media amp-img{display:block}

    .rv-hero-scan{
      position:absolute;
      top:-20%;
      left:0;
      z-index:2;
      width:100%;
      height:18%;
      pointer-events:none;
      background:
        linear-gradient(180deg,transparent,rgba(255,75,109,.24),rgba(255,255,255,.16),transparent);
      filter:blur(1px);
      animation:rvScanMove 4.2s linear infinite
    }

    .rv-feature-strip{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:6px;
      margin:12px 0 15px
    }

    .rv-feature-chip{
      position:relative;
      padding:8px 3px;
      color:#ffdbe2;
      background:
        linear-gradient(145deg,rgba(255,67,102,.1),rgba(56,0,13,.38));
      border:1px solid rgba(255,94,123,.2);
      border-radius:9px;
      font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:8px;
      font-weight:700;
      letter-spacing:.1px;
      text-align:center;
      text-transform:uppercase
    }

    .rv-feature-chip::before{
      content:"";
      position:absolute;
      top:4px;
      left:50%;
      width:18px;
      height:1px;
      background:var(--rv-hot);
      box-shadow:0 0 5px var(--rv-hot);
      transform:translateX(-50%)
    }

    .rv-access-list{
      display:flex;
      flex-direction:column;
      gap:10px
    }

    .rv-access-btn{
      position:relative;
      display:grid;
      grid-template-columns:36px 1fr 24px;
      align-items:center;
      min-height:54px;
      padding:8px 13px;
      overflow:hidden;
      color:#fff;
      text-decoration:none;
      text-transform:uppercase;
      border:1px solid transparent;
      border-radius:13px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.17),
        inset 0 -8px 15px rgba(0,0,0,.25),
        0 8px 17px rgba(0,0,0,.34);
      font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:12px;
      font-weight:800;
      letter-spacing:.45px;
      text-shadow:0 2px 5px rgba(0,0,0,.45);
      transition:filter .2s ease,transform .2s ease
    }

    .rv-access-btn::before{
      content:"";
      position:absolute;
      top:1px;
      left:4%;
      width:92%;
      height:35%;
      pointer-events:none;
      background:
        linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04),transparent);
      border-radius:10px 10px 40% 40%
    }

    .rv-access-btn::after{
      content:"";
      position:absolute;
      top:-90%;
      left:-55%;
      width:30%;
      height:280%;
      pointer-events:none;
      background:
        linear-gradient(90deg,transparent,rgba(255,255,255,.08),rgba(255,255,255,.42),rgba(255,255,255,.08),transparent);
      transform:rotate(22deg);
      animation:rvButtonShine 4.8s ease-in-out infinite
    }

    .rv-access-login{
      background:
        linear-gradient(145deg,#3a0009 0%,#700018 52%,#260005 100%);
      border-color:#b91c3a
    }

    .rv-access-register{
      background:
        linear-gradient(145deg,#f02652 0%,#ae002a 52%,#650015 100%);
      border-color:#ff718c;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        inset 0 -8px 15px rgba(67,0,14,.3),
        0 9px 19px rgba(105,0,24,.45),
        0 0 20px rgba(222,0,52,.18)
    }

    .rv-access-alt{
      background:
        linear-gradient(145deg,#1687ef 0%,#075abf 52%,#052e68 100%);
      border-color:#66b8ff;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        inset 0 -8px 15px rgba(0,28,67,.3),
        0 9px 19px rgba(0,45,101,.43),
        0 0 18px rgba(18,124,234,.17)
    }

    .rv-btn-index{
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      width:30px;
      height:30px;
      color:#fff;
      background:rgba(20,0,5,.3);
      border:1px solid rgba(255,255,255,.24);
      border-radius:9px;
      font-size:9px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.12)
    }

    .rv-btn-label{
      position:relative;
      z-index:2;
      text-align:center
    }

    .rv-btn-arrow{
      position:relative;
      z-index:2;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:24px;
      font-weight:400;
      text-align:right;
      transition:transform .2s ease
    }

    .rv-access-btn:hover{
      color:#fff;
      filter:brightness(1.1);
      transform:translateY(-2px)
    }

    .rv-access-btn:hover .rv-btn-arrow{
      transform:translateX(3px)
    }

    .rv-access-btn:active{
      transform:scale(.98)
    }

    .rv-vault-footer{
      position:relative;
      padding:13px 12px;
      color:var(--rv-muted);
      background:
        linear-gradient(180deg,rgba(66,0,15,.85),rgba(16,0,4,.96));
      border-top:1px solid rgba(255,81,113,.27);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:8px;
      font-weight:600;
      letter-spacing:.25px;
      text-align:center;
      text-transform:uppercase
    }

    .rv-opening{
      position:absolute;
      inset:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      pointer-events:none;
      background:#025439;
      animation:rvOpeningHide .7s cubic-bezier(.22,1,.36,1) 2.35s forwards
    }

    .rv-opening::before,
    .rv-opening::after{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      width:51%;
      background:
        radial-gradient(circle at center,rgba(174,0,42,.35),transparent 55%),
        linear-gradient(145deg,#00301f,#062216 58%,#052015);
      box-shadow:inset 0 0 30px rgba(255,63,101,.12);
      animation-duration:.85s;
      animation-timing-function:cubic-bezier(.77,0,.18,1);
      animation-delay:1.75s;
      animation-fill-mode:forwards
    }

    .rv-opening::before{
      left:0;
      border-right:1px solid rgba(255,92,123,.42);
      animation-name:rvPanelLeft
    }

    .rv-opening::after{
      right:0;
      border-left:1px solid rgba(255,92,123,.42);
      animation-name:rvPanelRight
    }

    .rv-opening-center{
      position:relative;
      z-index:3;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center
    }

    .rv-opening-seal{
      position:relative;
      width:72px;
      height:72px;
      margin-bottom:24px;
      opacity:0;
      transform:rotate(45deg) scale(.15);
      background:
        linear-gradient(145deg,#ff6684,#b3002d 48%,#600016);
      border:2px solid #ffb0bf;
      box-shadow:
        0 0 0 7px rgba(255,63,101,.07),
        0 0 35px rgba(255,45,88,.72),
        inset 0 1px 0 rgba(255,255,255,.35),
        inset 0 -9px 18px rgba(60,0,14,.32);
      animation:rvSealReveal 1.05s cubic-bezier(.22,1,.36,1) .1s forwards
    }

    .rv-opening-seal::before,
    .rv-opening-seal::after{
      content:"";
      position:absolute;
      top:50%;
      left:50%;
      background:#fff;
      box-shadow:0 0 9px rgba(255,255,255,.72);
      transform:translate(-50%,-50%)
    }

    .rv-opening-seal::before{
      width:28px;
      height:3px
    }

    .rv-opening-seal::after{
      width:3px;
      height:28px
    }

    .rv-opening-brand{
      position:relative;
      overflow:hidden;
      color:#fff;
      font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:25px;
      font-weight:800;
      line-height:1;
      letter-spacing:4px;
      text-align:center;
      text-shadow:
        0 0 17px rgba(255,74,110,.75),
        0 4px 14px rgba(0,0,0,.55);
      opacity:0;
      transform:translateY(18px);
      animation:rvBrandReveal .75s cubic-bezier(.22,1,.36,1) .7s forwards
    }

    .rv-opening-brand::after{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      left:-55%;
      width:30%;
      background:
        linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
      transform:skewX(-18deg);
      animation:rvBrandShine .75s ease 1.18s forwards
    }

    .rv-opening-line{
      width:0;
      height:2px;
      margin-top:15px;
      background:
        linear-gradient(90deg,transparent,var(--rv-hot),#fff,var(--rv-hot),transparent);
      box-shadow:0 0 11px rgba(255,62,100,.75);
      animation:rvLineExpand .65s ease 1s forwards
    }

    .rv-opening-subtitle{
      margin-top:10px;
      color:#ffc2ce;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:9px;
      font-weight:600;
      letter-spacing:1.5px;
      text-transform:uppercase;
      opacity:0;
      animation:rvSubtitleReveal .5s ease 1.2s forwards
    }

    @keyframes rvTopPulse{
      0%,100%{opacity:.42;transform:scaleX(.7)}
      50%{opacity:1;transform:scaleX(1)}
    }

    @keyframes rvVaultSweep{
      0%,28%{left:-55%;opacity:0}
      42%{opacity:.65}
      65%,100%{left:130%;opacity:0}
    }

    @keyframes rvGemPulse{
      0%,100%{
        opacity:.55;
        box-shadow:0 0 8px rgba(255,51,91,.4)
      }
      50%{
        opacity:1;
        box-shadow:0 0 17px rgba(255,51,91,.9)
      }
    }

    @keyframes rvStatusBlink{
      0%,100%{opacity:.45}
      50%{opacity:1}
    }

    @keyframes rvScanMove{
      0%{top:-20%;opacity:0}
      15%{opacity:1}
      75%{opacity:.75}
      100%{top:115%;opacity:0}
    }

    @keyframes rvButtonShine{
      0%,35%{left:-55%;opacity:0}
      48%{opacity:.75}
      68%,100%{left:130%;opacity:0}
    }

    @keyframes rvSealReveal{
      0%{
        opacity:0;
        transform:rotate(45deg) scale(.15)
      }
      65%{
        opacity:1;
        transform:rotate(225deg) scale(1.12)
      }
      100%{
        opacity:1;
        transform:rotate(225deg) scale(1)
      }
    }

    @keyframes rvBrandReveal{
      to{
        opacity:1;
        transform:translateY(0);
        letter-spacing:2.8px
      }
    }

    @keyframes rvBrandShine{
      to{left:130%}
    }

    @keyframes rvLineExpand{
      to{width:180px}
    }

    @keyframes rvSubtitleReveal{
      to{opacity:.8}
    }

    @keyframes rvPanelLeft{
      to{transform:translateX(-105%)}
    }

    @keyframes rvPanelRight{
      to{transform:translateX(105%)}
    }

    @keyframes rvOpeningHide{
      to{
        opacity:0;
        visibility:hidden
      }
    }

    @media(min-height:780px){
      body{align-items:center}
    }

    @media(max-width:480px){
      body{
        padding:11px 7px calc(11px + env(safe-area-inset-bottom))
      }

      .rv-vault-shell{border-radius:21px}

      .rv-vault-top{
        padding:11px 12px;
        font-size:8px
      }

      .rv-vault-body{padding:14px}

      .rv-brand-lockup{max-width:190px}

      .rv-kicker{
        margin:10px 0 14px;
        font-size:9px
      }

      .rv-hero-card{border-radius:15px}

      .rv-feature-strip{
        gap:4px;
        margin:10px 0 13px
      }

      .rv-feature-chip{
        padding:7px 2px;
        font-size:7px
      }

      .rv-access-list{gap:8px}

      .rv-access-btn{
